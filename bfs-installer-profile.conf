# BFSOS installer profile v1 - no passwords or LUKS passphrases are stored.
HOSTNAME=bfs-vmtest
TIMEZONE=America/New_York
LOCALE=en_US.UTF-8
USERNAME=user
BOOT_MODE=uefi
BOOT_DISK=''
