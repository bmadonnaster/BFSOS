# BFSOS systemd-user environment for graphical services that start before a
# login shell. Keep this limited to paths proven necessary for the /opt KF6
# stack; nonexistent directories are harmless path elements.
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/opt/kf6/bin:/opt/qt6/bin
XDG_DATA_DIRS=/usr/local/share:/usr/share:/opt/kf6/share
