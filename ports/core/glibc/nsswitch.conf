# /etc/nsswitch.conf

# systemd user/group synthesis is required for DynamicUser= services and for
# systemd-homed/nss-systemd integration.  Merge supplementary groups returned
# by nss-systemd instead of stopping after local /etc/group matches.
passwd: files systemd
group: files [SUCCESS=merge] systemd
shadow: files systemd
gshadow: files systemd

hosts: files dns
networks: files

protocols: files
services: files
ethers: files
rpc: files
