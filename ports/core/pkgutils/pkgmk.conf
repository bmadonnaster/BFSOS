#
# /etc/pkgmk.conf: pkgmk(8) configuration
#

export CFLAGS="-O2 -march=x86-64 -pipe"
export CXXFLAGS="${CFLAGS}"

export JOBS=$(nproc)
export MAKEFLAGS="-j $JOBS"

# BFSOS X.Org build policy.
# Package builds must not depend on /etc/profile.d/xorg.sh having been sourced.
export XORG_PREFIX="${XORG_PREFIX:-/usr}"
export XORG_CONFIG="${XORG_CONFIG:---prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static}"

case ${PKGMK_ARCH} in
        "64"|"")
                ;;
        "32")
                # BFSOS compat-32 is the ordinary i686 ELF32 ABI.  Keep all
                # architecture policy here so individual compat recipes do not
                # need to reinvent -m32, host triplets, or pkg-config paths.
                export BFS_MULTILIB_HOST="i686-pc-linux-gnu"
                export CHOST="$BFS_MULTILIB_HOST"
                export CFLAGS="-O2 -march=i686 -pipe -m32"
                export CXXFLAGS="$CFLAGS"
                export LDFLAGS="${LDFLAGS:+$LDFLAGS }-m32"
                export PKG_CONFIG_LIBDIR="/usr/lib32/pkgconfig:/usr/share/pkgconfig"
                export PKG_CONFIG_PATH=""
                export CMAKE_LIBRARY_PATH="/usr/lib32"
                export CMAKE_INCLUDE_PATH="/usr/include"
                ;;
        *)
                echo "Unknown architecture selected! Exiting."
                exit 1
                ;;
esac

#
# Source download mirrors and fallbacks
#

# Traditional CRUX flat site-local cache. None is enabled globally.
PKGMK_SOURCE_MIRRORS=()

# BFSOS flat distfile fallbacks.
#
# Redcore maintains a large Gentoo-style distfiles cache. This is useful
# because only the source filename is required.
PKGMK_SOURCE_FLAT_FALLBACKS=(
    "https://mirror.math.princeton.edu/pub/redcorelinux/amd64/distfiles"
)

# Path-preserving fallbacks.
#
# Format:
#   "original-prefix|fallback-prefix"
#
PKGMK_SOURCE_FALLBACKS=(
    "https://xorg.freedesktop.org/releases/|https://www.x.org/archive/"
    "https://www.x.org/releases/|https://www.x.org/archive/"
    "https://ftp.gnu.org/gnu/|https://ftpmirror.gnu.org/"
    # Savannah/Nongnu path mirrors. Keep the canonical download prefix in
    # sync with bootstrap and retain the verified netcologne alias.
    "https://download.savannah.gnu.org/releases/|https://mirror.fi.ossplanet.net/nongnu/"
    "https://debian.netcologne.de/savannah/|https://mirror.fi.ossplanet.net/nongnu/"
    # kernel.org path mirrors.
    "https://cdn.kernel.org/pub/|https://mirrors.edge.kernel.org/pub/"
    "https://www.kernel.org/pub/|https://mirrors.edge.kernel.org/pub/"
)

# Namespace cached sources by package.  Two unrelated upstream URLs may share a
# basename (Vulkan-Headers/Vulkan-Loader proved this can silently reuse the
# wrong archive).  Per-package directories make the cache identity include the
# package name while preserving renames= semantics within each port.
PKGMK_SOURCE_ROOT="/var/cache/pkg/sources"
PKGMK_SOURCE_DIR="$PKGMK_SOURCE_ROOT/$name"
if [ -d "$PKGMK_SOURCE_ROOT" ] || mkdir -p "$PKGMK_SOURCE_ROOT" 2>/dev/null; then
    mkdir -p "$PKGMK_SOURCE_DIR" 2>/dev/null || {
        echo "pkgmk: cannot create package source cache '$PKGMK_SOURCE_DIR'" >&2
        exit 1
    }
else
    echo "pkgmk: cannot create source-cache root '$PKGMK_SOURCE_ROOT'" >&2
    exit 1
fi
PKGMK_PACKAGE_DIR="/var/cache/pkg/packages"

# BFSOS large-build backend. bfs-pkgmk exports BFS_PKG_BUILD_WORK after
# reading the port's simple build_work= metadata. The disk root deliberately
# lives beside, not beneath, the installer-managed build-work tmpfs mount.
PKGMK_TMPFS_WORK_ROOT="/var/cache/pkg/build-work"
PKGMK_DISK_WORK_ROOT="${PKGMK_DISK_WORK_ROOT:-/var/cache/pkg/build-work-disk}"
case "${BFS_PKG_BUILD_WORK:-tmpfs}" in
    disk)  PKGMK_WORK_DIR="$PKGMK_DISK_WORK_ROOT/pkgmk-$name" ;;
    tmpfs|'') PKGMK_WORK_DIR="$PKGMK_TMPFS_WORK_ROOT/pkgmk-$name" ;;
    *)
        echo "pkgmk: invalid BFS_PKG_BUILD_WORK=${BFS_PKG_BUILD_WORK}; expected tmpfs or disk" >&2
        exit 1
        ;;
esac
# PKGMK_DOWNLOAD="no"
PKGMK_IGNORE_MD5SUM="no"
PKGMK_IGNORE_SIGNATURE="no"
PKGMK_IGNORE_FOOTPRINT="no"
# PKGMK_IGNORE_NEW="no"
# PKGMK_NO_STRIP="no"

PKGMK_DOWNLOAD_PROG="curl"

#
# curl behavior
#
# --fail                HTTP 4xx/5xx is a download failure.
# --location            Follow redirects.
# --continue-at -       Resume partial large downloads when possible.
# --connect-timeout 10  Do not sit on a dead endpoint for a long time.
# --speed-limit/time   Treat a transfer below 1 KiB/s for 30s as stalled.
# --retry 3             Retry interrupted/truncated large downloads.
# --retry-delay 2       Short pause between retries.
# --retry-max-time 180  Bound retry time for one source.
# Do not use --retry-all-errors here: with --fail it also retries permanent
# HTTP failures such as 404. Normal curl retry handling still retries transient
# transport/server failures, and --continue-at - resumes partial downloads.
# There is no default flat mirror, so healthy source URLs no longer incur a
# misleading mirror 404 before the real download begins.
#
PKGMK_CURL_OPTS="--fail --location --continue-at - --connect-timeout 10 --speed-limit 1024 --speed-time 30 --retry 3 --retry-delay 2 --retry-max-time 180 --retry-connrefused"

# PKGMK_WGET_OPTS=""
PKGMK_COMPRESSION_MODE="zst"

# ccache
export PATH="/usr/lib/ccache:$PATH"
export CCACHE_DIR="${CCACHE_DIR:-/var/cache/ccache}"
export CCACHE_MAXSIZE="${CCACHE_MAXSIZE:-20G}"

# Source the BFSOS pkgmk extension.  Keep the installed copy authoritative,
# but allow the synced core port to recover pkgmk after an interrupted
# pkgutils self-upgrade removes the installed extension.
_bfs_pkgmk_extension=/var/lib/pkgmk/extension
if [ ! -r "$_bfs_pkgmk_extension" ] && [ -r /usr/ports/core/pkgutils/extension ]; then
    echo "pkgmk: warning: installed BFSOS extension is missing; using core port fallback" >&2
    _bfs_pkgmk_extension=/usr/ports/core/pkgutils/extension
fi
if [ ! -r "$_bfs_pkgmk_extension" ]; then
    echo "pkgmk: BFSOS extension missing: /var/lib/pkgmk/extension" >&2
    exit 1
fi
. "$_bfs_pkgmk_extension"
unset _bfs_pkgmk_extension

# End of file

# Intentional BFSOS /opt toolchains used by package builds.
#
# Package builds are commonly invoked through sudo -> prt-get -> pkgmk, so
# they must not depend on an interactive login shell having sourced
# /etc/profile.d/*.sh.  32-bit builds intentionally skip these 64-bit /opt
# prefixes to prevent pkg-config/CMake from resolving incompatible libraries.
if [ "${PKGMK_ARCH:-}" != 32 ]; then
    for _bfs_prefix in /opt/rustc /opt/qt6 /opt/kf6 /opt/qt5; do
        if [ -d "$_bfs_prefix/bin" ]; then
            PATH="$_bfs_prefix/bin:$PATH"
        fi
        if [ -d "$_bfs_prefix/lib/pkgconfig" ]; then
            PKG_CONFIG_PATH="$_bfs_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
        fi
    done
    unset _bfs_prefix

    [ -d /opt/qt6 ] && QT6DIR=/opt/qt6
    [ -d /opt/qt5 ] && QT5DIR=/opt/qt5
    [ -d /opt/kf6 ] && KF6_PREFIX=/opt/kf6

    # BFSOS CMake package prefixes. Qt6, KDE Frameworks, and legacy Qt5 are
    # intentionally installed outside /usr.
    for _bfs_prefix in /opt/qt6 /opt/kf6 /opt/qt5; do
        if [ -d "$_bfs_prefix" ]; then
            CMAKE_PREFIX_PATH="$_bfs_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
        fi
    done
    unset _bfs_prefix

    export PATH PKG_CONFIG_PATH CMAKE_PREFIX_PATH
    export QT6DIR QT5DIR KF6_PREFIX
else
    unset QT6DIR QT5DIR KF6_PREFIX CMAKE_PREFIX_PATH
    export PKG_CONFIG_PATH=""
fi
