#
# /etc/pkgadd.conf: pkgadd(8) configuration
#

# Default rule (implicit)
#UPGRADE	^.*$			YES

UPGRADE		^etc/.*$		NO
UPGRADE		^var/log/.*$		NO
UPGRADE		^var/spool/\w*cron/.*$	NO
UPGRADE		^var/run/utmp$		NO

UPGRADE		^etc/ports/drivers/.*$	YES
UPGRADE		^etc/X11/.*$		YES


UPGRADE		^etc/udev/rules.d/.*$	YES
UPGRADE		^etc/udev/rules.d/1.*$	NO
UPGRADE		^etc/udev/hwdb.d/.*$	YES
UPGRADE		^etc/udev/hwdb.bin$	YES

UPGRADE		^etc/ssl/cert.pem$	YES

UPGRADE		^(dev|proc|sys|run)/.*$	NO

# BFSOS package-manager configuration is distribution managed.
UPGRADE ^etc/pkgmk\.conf$ YES
UPGRADE ^etc/pkgadd\.conf$ YES

# BFSOS release identity is distribution managed and must be replaced on
# aaa_filesystem upgrades even though /etc is protected by the general rule.
UPGRADE ^etc/os-release$ YES
UPGRADE ^etc/bfs-release$ YES
UPGRADE ^etc/lfs-release$ YES
UPGRADE ^etc/issue$ YES

# BFSOS Dracut policy shipped by the distribution.
UPGRADE ^usr/lib/dracut/dracut\.conf\.d/50-bfsos-storage\.conf$ YES

# End of file
